<!-- 引入 FontAwesome 图标（可选，增强美观度） -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script>
  // 替换为你的 Memos 域名和用户 ID (名称/UID)
  const MEMOS_HOST = "https://your-memos-domain.com";
  // 0.30+ 版本的 API Endpoint
  const MEMOS_API = `${MEMOS_HOST}/api/v1/memos?pageSize=30`;

  fetch(MEMOS_API)
    .then(res => res.json())
    .then(data => {
      const container = document.getElementById("memos-container");
      container.innerHTML = "";
      
      const memos = data.memos || [];
      if (memos.length === 0) {
        container.innerHTML = "<p>暂无公开动态</p>";
        return;
      }

      memos.forEach(memo => {
        // 解析时间与内容
        const date = new Date(memo.createTime).toLocaleString();
        let content = memo.content || "";
        
        // 简单处理标签 #hashtag 美化
        content = content.replace(/#([^\s#]+)/g, '<span class="memo-tag">#$1</span>');

        // 构建卡片 HTML
        const card = document.createElement("div");
        card.className = "memo-card";
        card.innerHTML = `
          <div class="memo-header">
            <span class="memo-time"><i class="fa-regular fa-clock"></i> ${date}</span>
          </div>
          <div class="memo-content">${content}</div>
        `;
        container.appendChild(card);
      });
    })
    .catch(err => {
      console.error(err);
      document.getElementById("memos-container").innerHTML = "加载动态失败，请检查 API 连接或 CORS 设置。";
    });
</script>
